name: Test Vox access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python -c "from curl_cffi import requests; r=requests.get('https://egy.voxcinemas.com/showtimes/city-centre-almaza', impersonate='chrome', timeout=30); print(r.status_code, len(r.text))"
